; ============================================================================
; PlatformIO Configuration File untuk Firmware ESP32
; IoT Monitoring Suhu dan Kelembaban (ESP32 -> Google Apps Script)
; ============================================================================

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Serial Monitor & Upload Port Speed
monitor_speed = 115200
upload_speed = 921600

; Dependensi Library Otomatis
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SHT31 Library @ ^2.2.2

; Opsi Kompilator Tambahan
build_flags =
    -DCORE_DEBUG_LEVEL=0
